# Quantumult X 重写规则：B 站开屏广告
# 用法：在 [rewrite_remote] 中引用本文件，并确保已开启 MITM。

hostname = app.bilibili.com, upos-sz-static.bilivideo.com, upos-sz-staticcos.bilivideo.com

# 开屏配置：清空 show / event_list，取消缓存广告
^https?:\/\/app\.bilibili\.com\/(x\/v2\/splash\/(list|show|event\/list2|brand\/list)|x\/resource\/peak\/download) url script-response-body https://raw.githubusercontent.com/Loner1024/QxRewrite/master/bilibili_splash.js

# 开屏素材兜底
^https?:\/\/upos-sz-static(cos)?\.bilivideo\.com\/ssaxcode\/\w{2}\/\w{2}\/\w{32}-1-SPLASH url reject-dict
^http:\/\/[\d.]+:8000\/v1\/resource\/\w{32}-1-SPLASH url reject-dict
